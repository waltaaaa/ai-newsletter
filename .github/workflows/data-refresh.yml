name: Data Refresh (timeseries)

on:
  schedule:
    # Daily 07:00 UTC — offset from daily-indicators (05:00), weekly Mon
    # (10:30), monthly-refresh 1st (11:00), deep-sweep 15th (09:00).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh-timeseries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No Claude / no API key / no OAuth token. Pure data fetch:
      # FRED + yfinance + Bank of Canada into docs/data/timeseries.json
      # (merge-by-date; hand-patched content preserved). Runs on GitHub's
      # unrestricted network so FRED series blocked from the local machine
      # populate here.
      - name: Refresh timeseries (FRED / yfinance / BoC)
        run: python tools/refresh_timeseries_commodity.py

      - name: Validate briefing schema (deploy gate)
        run: |
          set +e
          python tools/validate_briefing_schema.py docs/data/briefing_latest.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Validator PASS"; exit 0
          elif [ "$rc" -eq 2 ]; then
            echo "Validator WARN (0 FAIL) — proceeding"; exit 0
          else
            echo "Validator FAIL — rc=$rc — blocking"; exit 1
          fi

      - name: Commit and push updated timeseries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/timeseries.json
          git diff --staged --quiet || (git commit -m "auto: timeseries data refresh $(date +%Y-%m-%d)" && git push)

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `data-refresh failed: ${new Date().toISOString().split('T')[0]}`;
            const body = `The data-refresh (timeseries) workflow failed on run #${context.runNumber}.\n\n` +
              `[View run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `Timeseries data may now be stale despite green CI on other workflows.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['pipeline-failure']
            });
