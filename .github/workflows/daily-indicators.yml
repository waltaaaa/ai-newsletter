name: Daily Indicators

on:
  schedule:
    # Midnight ET = 5:00 UTC (UTC-5 in winter, UTC-4 in summer; use 5:00 UTC)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-indicators:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily indicator refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          SONNET_MODEL: claude-sonnet-4-6
          GEMINI_SEARCH_ENABLED: "false"
        run: python update_dashboard.py --indicators-only

      - name: Deploy static assets to docs/
        run: python deploy_to_github.py

      - name: Commit and push updated docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || (git commit -m "auto: daily indicators $(date +%Y-%m-%d)" && git push)
