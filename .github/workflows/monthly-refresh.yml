name: Monthly Government Data Refresh

on:
  schedule:
    # 1st of each month at 6:00 AM ET = 11:00 UTC
    - cron: "0 11 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backup database
        run: cp dashboard.db dashboard.db.bak 2>/dev/null || true

      - name: Run monthly government data refresh
        run: python tools/backfill_projects.py --refresh --export

      # Full pull (no --active-only) so archived tables flow into the Data
      # Explorer flagged with a:1. WDS getAllCubesListLite — free, no API key.
      - name: Refresh StatCan table registry and Data Explorer directory
        continue-on-error: true
        run: |
          pip install pandas
          python statcan_table_registry.py --csv --output config/statcan_table_registry
          python -c "from tools.export_dashboard import export_statcan_tables as e; e(None,'docs/data'); e(None,'public/data')"

      - name: Run coverage monitor
        run: python tools/coverage_monitor.py
        continue-on-error: true

      - name: Deploy static assets to docs/
        run: python tools/deploy_to_github.py

      - name: Compact database
        run: python -c "import sqlite3; c=sqlite3.connect('dashboard.db'); c.execute('VACUUM'); c.close()"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ dashboard.db public/data/statcan_tables.json config/statcan_table_registry.csv config/statcan_table_registry.xlsx
          git diff --staged --quiet || (git commit -m "auto: monthly government data refresh $(date +%Y-%m-%d)" && git push)

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `monthly-refresh failed: ${new Date().toISOString().split('T')[0]}`;
            const body = `The monthly-refresh workflow failed on run #${context.runNumber}.\n\n` +
              `[View run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
              `Monthly government data may now be stale despite green CI on other workflows.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['pipeline-failure']
            });
